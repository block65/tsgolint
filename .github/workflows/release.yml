# CI in this fork is intentionally reduced to this release workflow: it builds
# the platform binaries and publishes the @block65/oxlint-tsgolint packages.
name: Release

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: version without leading `v`
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # required for git am --3way to work properly
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: just build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsgolint-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tsgolint

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tsgolint-*
          path: build

      - name: chmod +x
        run: find build -type f -name tsgolint -exec chmod +x {} \;

      - name: Resolve version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${INPUT:-${TAG#v}}" >> "$GITHUB_OUTPUT"

      - name: Generate npm packages
        env:
          TSGOLINT_VERSION: ${{ steps.version.outputs.version }}
        run: node ./tools/gen-npm-packages.mjs

      # the trusted publisher grants "npm stage publish", so this uploads for
      # review rather than going live. approve it with pnpm stage approve.
      # provenance is attached automatically when publishing over oidc
      - name: Publish
        run: |
          for package in npm/*; do
            pushd "$package"
            pnpm stage publish --access public --no-git-checks
            popd
          done
