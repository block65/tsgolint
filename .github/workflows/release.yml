# CI in this fork is intentionally reduced to this release workflow: it builds
# the platform binaries and publishes the @block65/oxlint-tsgolint packages.
# Only manual dispatch or a published release can run it, every action is
# pinned to a commit, and the version comes from the VERSION file on the branch.
name: Release

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: must equal the VERSION file, without leading `v`
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # required for git am --3way to work properly
          submodules: true
          persist-credentials: false

      - name: Check the supplied version against VERSION
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="$(cat VERSION)"
          supplied="${INPUT:-${TAG#v}}"
          if [ "$supplied" != "$expected" ]; then
            echo "supplied version '$supplied' differs from VERSION '$expected'"
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Apply typescript-go patches
        run: |
          git config --global user.email "release@block65.invalid"
          git config --global user.name "release"
          cd typescript-go
          git am --3way --no-gpg-sign ../patches/*.patch

      - name: Expose typescript-go collections package
        run: |
          mkdir -p internal/collections
          find ./typescript-go/internal/collections -type f ! -name '*_test.go' -exec cp {} internal/collections/ \;

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -trimpath -o tsgolint ./cmd/tsgolint

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsgolint-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tsgolint

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tsgolint-*
          path: build

      - name: chmod +x
        run: find build -type f -name tsgolint -exec chmod +x {} \;

      # The generator reads VERSION and refuses a differing TSGOLINT_VERSION
      - name: Generate npm packages
        env:
          TSGOLINT_VERSION: ${{ inputs.version || '' }}
        run: node ./tools/gen-npm-packages.mjs

      # the trusted publisher grants "npm stage publish", so this uploads for
      # review rather than going live. approve it with pnpm stage approve.
      # provenance is attached automatically when publishing over oidc
      - name: Publish
        run: |
          for package in npm/*; do
            pushd "$package"
            pnpm stage publish --access public --no-git-checks
            popd
          done
